name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew build
      - name: the jar runs the command line against a fresh database
        run: |
          java -jar build/libs/staplewright-1.0.0.jar --version
          java -jar build/libs/staplewright-1.0.0.jar --database jdbc:h2:./smoke build
          java -jar build/libs/staplewright-1.0.0.jar --database jdbc:h2:./smoke tables
          java -jar build/libs/staplewright-1.0.0.jar --database jdbc:h2:./smoke check
