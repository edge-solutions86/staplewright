name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONWARNINGS: error::SyntaxWarning

jobs:
  check:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .

      - name: types
        run: mypy --platform linux

      - name: tests
        run: pytest -p no:randomly

      - name: the migrations reach the head the models describe
        run: |
          alembic upgrade head
          alembic check
        env:
          HASPLIB_DATABASE: sqlite+pysqlite:///ci.sqlite3

      - name: the package installs and the console script runs
        run: |
          python -m pip install --no-deps .
          hasplib --version
          hasplib --database sqlite+pysqlite:///smoke.sqlite3 build
          hasplib --database sqlite+pysqlite:///smoke.sqlite3 tables
          hasplib --database sqlite+pysqlite:///smoke.sqlite3 check
